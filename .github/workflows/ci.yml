name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Formatierung prüfen
        run: npm run format:check

      - name: Typen prüfen
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Interne Links prüfen
        run: npm run check:links

      - name: Typografie prüfen
        run: npm run check:typography

      - name: Drittanbieter-Ressourcen prüfen
        run: npm run check:privacy

      - name: Rechtstexte prüfen
        run: |
          npm run check:legal | tee legal-report.txt
          {
            echo "### Rechtstexte"
            echo ""
            echo '```'
            cat legal-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build hochladen
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Lighthouse CI
        run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
